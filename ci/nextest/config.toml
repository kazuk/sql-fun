# Local workspace-related checks retain the one-second failure limit.
[profile.default]
slow-timeout = { period = "1s", terminate-after = 1, grace-period = "0s" }

# CI reports SLOW at one second and terminates after two periods.
[profile.ci]
fail-fast = false
slow-timeout = { period = "1s", terminate-after = 2, grace-period = "0s" }
final-status-level = "slow"
junit.path = "junit.xml"

# Archive groups run independently, with persistent, non-overlapping reports.
[profile.ci-a]
fail-fast = false
slow-timeout = { period = "1s", terminate-after = 2, grace-period = "0s" }
final-status-level = "slow"
junit.path = "junit.xml"

[profile.ci-b]
fail-fast = false
slow-timeout = { period = "1s", terminate-after = 2, grace-period = "0s" }
final-status-level = "slow"
junit.path = "junit.xml"
