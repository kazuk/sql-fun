name: build and test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

env:
  CARGO_TERM_COLOR: never
  USER: runner

jobs:
  workspace:
    runs-on: ubuntu-24.04
    container: &ci-builder-container
      image: ghcr.io/kazuk/ci-builder@sha256:52907a6c7cbc06b1c763ef319cacc5523a9039a22250fbd336d4bf47ad75d248
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Disk usage before cache restore
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build and test
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=workspace --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --show-progress none"
          sccache --show-stats

      - name: Disk usage after build and test
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: nextest tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit


  workspace-all-features:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - name: Disk usage before cache restore
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-workspace-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-workspace-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build and test with all features
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --all-features --step=workspace --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --show-progress none"
          sccache --show-stats

      - name: Disk usage after build and test
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: nextest tests (all features)
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  proc-macro-tests:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-proc-macro-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-proc-macro-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Proc-macro compilation tests
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=proc-macro-tests --all-features --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --test-threads=1
            --show-progress none"
          sccache --show-stats

      - name: Disk usage after proc-macro compilation tests
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: proc-macro compilation tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  fmt:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: .local/bin/check-test-flow --step=fmt --fmt-check

  lint:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Lint
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=lint
          sccache --show-stats

      - name: Check typos
        run: .local/bin/check-test-flow --step=typos

      - name: Validate skills
        run: .local/bin/check-test-flow --step=skill-lint

      - name: Lint Markdown
        run: .local/bin/check-test-flow --step=markdown-lint

  server-api-spec:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Generate server API spec
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=server-api-spec
          sccache --show-stats

  deny:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - name: Check dependencies
        run: .local/bin/check-test-flow --step=deny

  dependency-updates:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check dependency updates
        run: .local/bin/check-test-flow --step=dependency-updates

  doc:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build docs
        run: |
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=doc
          sccache --show-stats

  build:
    runs-on: ubuntu-24.04
    needs:
      - workspace
      - workspace-all-features
      - proc-macro-tests
      - fmt
      - lint
      - server-api-spec
      - deny
      - dependency-updates
      - doc
    steps:
      - name: Complete
        run: true
