[package]
name = "sql-fun-server-api"
version = "0.2.0-snapshot33102"
edition = "2024"
license = "MIT"
description = "API type crate for sql-fun-server"
categories = ["database", "development-tools"]
keywords.workspace = true
repository.workspace = true
readme = "README.md"

[[bin]]
name = "openrpc-spec"
path = "src/bin/openrpc_spec.rs"
required-features = ["openrpc-schema", "bin-deps"]

[features]
bin-deps = ["dep:clap", "dep:anyhow"]
openrpc-schema = ["sql-fun-core/openrpc-schema", "dep:typed-openrpc", "dep:schemars"]
sqlite = ["sql-fun-core/sqlite"]

[dependencies]
anyhow = { workspace = true, optional = true }
async-trait.workspace = true
clap = { workspace = true, optional = true }
derive-getters.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sql-fun-core.workspace = true
thiserror.workspace = true
typed-openrpc = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
rstest.workspace = true
testresult.workspace = true

[lints]
workspace = true
