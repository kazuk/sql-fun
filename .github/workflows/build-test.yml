name: build and test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

env:
  CARGO_TERM_COLOR: never
  USER: runner

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kazuk/ci-builder@sha256:359df7b978d88f96c3bb049570821d096fa0b423a933ae968fd96ed8c80f5aee
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v4
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: check dependencies
        run: |
          cargo deny check

      - name: buil and test
        run: |
          export GIT_ROOT="$(git rev-parse --show-toplevel)"
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --show-progress none"
          sccache --show-stats

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: nextest tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit
