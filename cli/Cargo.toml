[package]
name = "sql-fun-cli"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "command line tool for sql-fun"
categories = ["database", "development-tools", "command-line-utilities"]
keywords.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata.deb]
name = "sql-fun"
maintainer = "kazuk <kazuk.dll@gmail.com>"
copyright = "2025 kazuk <kazuk.dll@gmail.com>"
license-file = ["../LICENSE", "0"]
# cargo-deb excludes libgcc from $auto; dpkg-shlibdeps on both binaries requires it.
depends = "$auto, libgcc-s1 (>= 4.2)"
revision = ""
section = "devel"
priority = "optional"
assets = [
    ["target/release/sql-fun", "usr/bin/sql-fun", "755"],
    ["target/release/sql-fun-server", "usr/bin/sql-fun-server", "755"],
]

[[bin]]
name = "sql-fun"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
bollard.workspace = true
cargo_metadata.workspace = true
clap.workspace = true
derive_builder.workspace = true
directories.workspace = true
either.workspace = true
env_logger.workspace = true
futures-util.workspace = true
glob.workspace = true
inquire.workspace = true
log.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
shellexpand.workspace = true
sql-fun-codegen.workspace = true
sql-fun-core.workspace = true
statig.workspace = true
syn.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
url.workspace = true
walkdir.workspace = true
which.workspace = true

[dev-dependencies]
rstest.workspace = true

[lints]
workspace = true
