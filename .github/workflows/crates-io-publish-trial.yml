name: crates.io publish trial

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: Snapshot prerelease name; `snapshot1` produces `0.1.1-snapshot1`
        required: true
        type: string
      stop_after:
        description: Optional package name after which to stop intentionally
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  USER: runner

jobs:
  publish:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kazuk/ci-builder@sha256:1e8a6a618d5f37c7eaf588650999b53dd39220323ea475a66a52987d1479ebf3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Materialize snapshot versions
        run: |
          .local/bin/materialize-release-versions \
            --snapshot="${{ inputs.snapshot }}" \
            --output="$RUNNER_TEMP/crates.tsv"

      - uses: rust-lang/crates-io-auth-action@v1
        id: crates_io_auth

      - name: Publish or resume each crate
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          CRATES_IO_BOOTSTRAP_KEY: ${{ secrets.CRATES_IO_BOOTSTRAP_KEY }}
        run: |
          args=(--manifest="$RUNNER_TEMP/crates.tsv")
          if [[ -n "${{ inputs.stop_after }}" ]]; then
            args+=(--stop-after="${{ inputs.stop_after }}")
          fi
          .local/bin/publish-crates "${args[@]}"

      - name: Record trial result
        if: ${{ always() }}
        run: |
          {
            echo '## crates.io publish trial'
            echo
            echo "Snapshot: \`${{ inputs.snapshot }}\`"
            echo 'Each crate is packaged and published from the materialized source revision with Cargo verbose output retained as trial evidence.'
          } >> "$GITHUB_STEP_SUMMARY"
