x-postgres: &postgres
  environment:
    POSTGRES_USER: oracle
    POSTGRES_PASSWORD: sql-fun-development-only
    POSTGRES_DB: oracle
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        PGPASSWORD="$$POSTGRES_PASSWORD" psql -X -w -h 127.0.0.1
        -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -Atc 'SELECT 1' | grep -qx 1
    interval: 2s
    timeout: 5s
    retries: 50
    start_period: 10s

services:
  builder:
    image: ci-builder:local
    pull_policy: never
    user: "${BUILDER_UID:?Set BUILDER_UID}:${BUILDER_GID:?Set BUILDER_GID}"
    working_dir: /home/builder/workspace
    stdin_open: true
    tty: true
    environment:
      HOME: /home/builder
      CARGO_HOME: /home/builder/.cargo
      USER: builder
      PGUSER: oracle
      PGPASSWORD: sql-fun-development-only
      PGDATABASE: oracle
    volumes:
      - user_home:/home:rw
      - type: bind
        source: ${GIT_ROOT:?Set GIT_ROOT}
        target: /home/builder/workspace
        bind:
          create_host_path: false
      - ci_target:/home/builder/workspace/target:rw

  postgres15:
    <<: *postgres
    image: postgres:15
    tmpfs:
      - /var/lib/postgresql/data

  postgres16:
    <<: *postgres
    image: postgres:16
    tmpfs:
      - /var/lib/postgresql/data

  postgres17:
    <<: *postgres
    image: postgres:17
    tmpfs:
      - /var/lib/postgresql/data

  postgres18:
    <<: *postgres
    image: postgres:18
    tmpfs:
      - /var/lib/postgresql

volumes:
  user_home:
    external: true
    name: user_home
  ci_target:
    external: true
    name: ci_target
