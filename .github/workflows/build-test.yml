name: build and test

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kazuk/ci-builder@sha256:23d5245a24c3b23ea8165cfaeec31042e56861fb383e9b61c5435effe6d6b6c5
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: buil and test
        run: |
          .local/bin/check-test-flow --nextest-extra=" 
            --config-file ./ci/nextest/config.toml 
            --profile ci 
            --show-progress none"

      - name: Test Report
        uses: dorny/test-reporter@v2
        if: ${{ !cancelled() }}
        with:
          name: nextest tests
          path: target/nextest/junit.xml
          reporter: java-junit

