name: Rebase auto-merge pull requests

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  rebase-auto-merge-prs:
    runs-on: ubuntu-latest

    steps:
      - name: Create maintenance bot token
        id: maintenance-bot-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.MAINTENANCE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.MAINTENANCE_BOT_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
          permission-pull-requests: write

      - name: Rebase outdated auto-merge pull request
        env:
          GH_TOKEN: ${{ steps.maintenance-bot-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          build_test_running="$(
            gh run list \
              --repo "$GH_REPO" \
              --workflow build-test.yml \
              --json status \
              --jq 'any(.[]; .status == "queued" or .status == "in_progress")'
          )"

          if [[ "$build_test_running" == "true" ]]; then
            echo "build-test.yml is already running; skipping"
            exit 0
          fi

          pr="$(
            gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --json number,autoMergeRequest,mergeStateStatus \
              --jq '
                .[]
                | select(
                    .autoMergeRequest != null
                    and .mergeStateStatus == "BEHIND"
                  )
                | .number
              ' \
            | shuf -n 1
          )"

          if [[ -z "$pr" ]]; then
            echo "No outdated auto-merge pull requests"
            exit 0
          fi

          echo "Rebasing PR #${pr}"

          if gh pr update-branch "$pr" \
            --repo "$GH_REPO" \
            --rebase
          then
            echo "PR #${pr} updated"
          else
            echo "::warning::Failed to rebase PR #${pr}; disabling auto-merge"

            if ! gh pr merge "$pr" \
              --repo "$GH_REPO" \
              --disable-auto
            then
              echo "::error::Failed to disable auto-merge for PR #${pr}"
              exit 1
            fi
          fi
