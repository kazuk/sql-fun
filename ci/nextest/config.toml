# Mandatory per-case policy for workspace-related check-test-flow invocations.
[profile.default]
slow-timeout = { period = "1s", terminate-after = 1, grace-period = "0s" }

[profile.ci]
fail-fast = false
junit.path = "junit.xml"

# Archive groups run independently, with persistent, non-overlapping reports.
[profile.ci-a]
fail-fast = false
test-threads = 1
junit.path = "junit.xml"

[profile.ci-b]
fail-fast = false
test-threads = 1
junit.path = "junit.xml"
