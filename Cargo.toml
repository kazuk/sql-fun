
[package]
name = "sql-fun"
license = "MIT"
version = "0.1.0"
edition = "2024"
authors = ["kazuk"]
description = "SQL query/statement execution code generator"
repository.workspace = true
exclude = ["/postgres"]
categories = ["database", "development-tools"]
keywords.workspace = true

[package.metadata]

[package.metadata.database]
connector = "tokio-postgres"

[workspace]
resolver = "2"
members = [
    "cli",
    "examples/adventure-works",
    "parse_dat",
    "sql-fun-client",
    "sql-fun-codegen",
    "sql-fun-core",
    "sql-fun-server",
    "sql-fun-server-api",
    "sql-fun-sqlast",
    "xbuild",
]

[workspace.package]
repository = "https://github.com/kazuk/sql-fun/"
keywords = ["PostgreSQL", "SQLite", "SQL", "Semantic validator", "Schema aware validator"]

[workspace.metadata]
baseline = "v0.1.0-baseline"

[workspace.metadata.next-release]
sql-fun = "patch"
sql-fun-cli = "patch"
sql-fun-server = "patch"
sql-fun-server-api = "patch"
sql-fun-core = "patch"
sql-fun-client = "patch"
sql-fun-sqlast = "patch"

[workspace.lints]

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
use_self = { level = "warn" }
multiple_crate_versions = { level = "allow" }

[workspace.dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
askama = "0.16"
assert_matches = { version = "1" }
async-trait = "0.1.89"
backtrace-on-stack-overflow = "0.3"
bollard = "0.21"
cargo_metadata = "0.23.1"
chumsky = "0.13"
clap = { version = "4.6", features = ["derive", "env"] }
combine = "4.6"
compact_str = "0.9"
convert_case = "0.11"
ctor = "0.12"
derive-getters = "0.5"
derive_builder = "0.20"
directories = "6.0"
either = { version = "1.15", features = ["serde"] }
env_logger = "0.11"
fs2 = "0.4"
futures-core = "0.3"
futures-util = "0.3"
glob = "0.3"
indexmap = "2.14.0"
inquire = "0.9"
itertools = "0.14"
j9 = "0.1"
log = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.31", features = ["process", "signal"] }
owo-colors = "4.2.3"
pg_query = "6.1"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.10"
rstest = "0.26"
schemars = { version = "1.2.1", features = ["url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
shellexpand = "3.1"
smallvec = "1.15"
sql-fun = { path = ".", version = "0.1.0" }
sql-fun-client = { path = "./sql-fun-client", version = "0.1.0" }
sql-fun-core = { path = "./sql-fun-core", version = "0.1.1" }
sql-fun-server-api = { path = "sql-fun-server-api", version = "0.1.0" }
sql-fun-sqlast = { path = "./sql-fun-sqlast", version = "0.1.0", features = [] }
syn = { version = "2.0", features = ["full", "visit"] }
sysinfo = "0.38"
tempfile = "3.27.0"
testresult = "0.4"
thiserror = "2.0"
time = { version = "0.3.45", features = ["serde"] }
tokio = { version = "1.52", features = ["full"] }
tokio-postgres = "0.7"
toml = "1.0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
trybuild = { version = "1.0.114", features = ["diff"] }
typed-openrpc = "0.1.1"
url = { version = "2.5", features = ["serde"] }
walkdir = "2.3"
which = "8.0"

[lib]
proc-macro = true

[dependencies]
compact_str = { workspace = true }
derive_builder = { workspace = true }
pg_query = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
sql-fun-client = { workspace = true }
sql-fun-core = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
derive_builder = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
