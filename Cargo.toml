
[package]
name = "sql-fun"
license = "MIT"
version = "0.1.0"
edition = "2024"
authors = ["kazuk"]
description = "SQL query/statement execution code generator"
exclude = ["/postgres"]
categories = ["database", "development-tools"]
keywords.workspace = true
repository.workspace = true
rust-version.workspace = true

[package.metadata]

[package.metadata.database]
connector = "tokio-postgres"

[workspace]
resolver = "2"
members = [
    "cli",
    "examples/adventure-works",
    "parse_dat",
    "sql-fun-client",
    "sql-fun-codegen",
    "sql-fun-collector",
    "sql-fun-core",
    "sql-fun-server",
    "sql-fun-server-api",
    "sql-fun-sqlast",
    "xbuild",
]

[workspace.package]
rust-version = "1.93.1"
repository = "https://github.com/kazuk/sql-fun/"
keywords = ["PostgreSQL", "SQLite", "SQL", "Semantic validator", "Schema aware validator"]

[workspace.metadata]
baseline = "v0.1.0-baseline"

[workspace.metadata.next-release]
sql-fun = "patch"
sql-fun-cli = "patch"
sql-fun-server = "patch"
sql-fun-server-api = "patch"
sql-fun-core = "patch"
sql-fun-client = "patch"
sql-fun-sqlast = "patch"

[workspace.lints]

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
use_self = { level = "warn" }
multiple_crate_versions = { level = "allow" }
missing_const_for_fn = "warn"
disallowed_methods = "deny"
# See "Test placement" in docs/internal-rules/rust-coding-guideline.md.
items_after_test_module = "allow"

[workspace.dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
askama = "0.16"
assert_matches = { version = "1" }
async-trait = "0.1.89"
backtrace-on-stack-overflow = "0.3"
bollard = "0.21"
cargo_metadata = "0.23.1"
chumsky = "0.13"
clap = { version = "4.6", features = ["derive", "env"] }
combine = "4.6"
compact_str = "0.10"
convert_case = "0.12"
ctor = "1.0"
darling = "0.23.0"
derive-getters = "0.5"
derive_builder = "0.20"
directories = "6.0"
either = { version = "1.16", features = ["serde"] }
env_logger = "0.11"
fs-err = "3.2.2"
fs2 = "0.4"
futures-core = "0.3"
futures-util = "0.3"
glob = "0.3"
hex = "0.4.3"
indexmap = { version = "2.14.0", features = ["serde"] }
inquire = "0.9"
itertools = "0.15"
j9 = "0.1"
log = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.31", features = ["process", "signal"] }
owo-colors = "4.2.3"
petgraph = "0.8.3"
pg_query = "6.1"
proc-macro2 = { version = "1.0", features = ["span-locations"] }
proc_macro2_diagnostic = "0.6.3"
quote = "1.0"
rand = "0.10"
rstest = "0.27"
schemars = { version = "1.2.1", features = ["url2"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_json_path = "0.7.2"
serde_spanned = "1.1.1"
serde_yaml_ng = "0.10.0"
sha2 = "0.11"
sha256 = "1.6.0"
shellexpand = "3.1"
smallvec = "1.15"
sql-fun = { path = ".", version = "0.1.0" }
sql-fun-client = { path = "./sql-fun-client", version = "0.1.0" }
sql-fun-codegen = { path = "./sql-fun-codegen", version = "0.1.0" }
sql-fun-core = { path = "./sql-fun-core", version = "0.1.1" }
sql-fun-server-api = { path = "sql-fun-server-api", version = "0.1.0" }
sql-fun-sqlast = { path = "./sql-fun-sqlast", version = "0.1.0", features = [] }
statig = "0.4.1"
syn = { version = "3.0", features = ["extra-traits", "full", "visit"] }
sysinfo = "0.39"
tempfile = "3.27.0"
testresult = "0.4"
thiserror = "2.0"
time = { version = "0.3.45", features = ["serde"] }
tokio = { version = "1.52", features = ["full"] }
tokio-postgres = "0.7"
toml = "1.0.6"
toml_parser = "1.1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
trybuild = { version = "1.0.114", features = ["diff"] }
typed-openrpc = "0.1.1"
url = { version = "2.5", features = ["serde"] }
walkdir = "2.3"
which = "8.0"

[lib]
proc-macro = true

[features]
sqlite = ["sql-fun-client/sqlite", "sql-fun-codegen/sqlite", "sql-fun-core/sqlite"]

[dependencies]
compact_str = { workspace = true }
derive_builder = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
sql-fun-client = { workspace = true }
sql-fun-codegen = { workspace = true }
sql-fun-core = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
anyhow = { workspace = true }
bon = "3.10.1"
derive_builder = { workspace = true }
futures-util = { workspace = true }
rstest = { workspace = true }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks"] }
scopeguard = "1.2.0"
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
trybuild = { workspace = true }

[[test]]
name = "rusqlite"
required-features = ["sqlite"]

[lints]
workspace = true
