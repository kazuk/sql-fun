[files]
extend-exclude = [
    "postgres",
    "examples/adventure-works/schema.develop.sql",
    "sql-fun-sqlast/src/syn/generated.rs",
    "**/*.svg",
    "graphify-out/"
]

[default]
locale = "en"

[default.extend-words]
inh="inh"
larg="larg"
deferred="deferred"

# PostgreSQL boolean input accepts these prefixes and mixed-case spellings.
[type.rust]
extend-ignore-re = ['"tru"', '"fals"']

[type.json]
extend-ignore-re = ["'tru'", "'fals'", "'  TrUe  '"]
