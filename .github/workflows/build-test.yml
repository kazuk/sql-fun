name: build and test

on:
  pull_request:
    branches-ignore:
      - ci-image
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

concurrency:
  group: build-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: never
  USER: runner

jobs:
  pr-freshness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Reject PR heads missing current base
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags origin "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          git fetch --no-tags origin "$PR_HEAD_SHA"
          if ! git merge-base --is-ancestor "refs/remotes/origin/${PR_BASE_REF}" "$PR_HEAD_SHA"; then
            echo "::error::PR head does not contain the current base (${PR_BASE_REF}); rebase onto the PR base before CI."
            exit 1
          fi

  workspace-all-features:
    name: SQLite ${{ matrix.sqlite }}
    needs: pr-freshness
    strategy:
      fail-fast: false
      matrix:
        include:
          - sqlite: bundled
            use_pkg_config: "0"
          - sqlite: system
            use_pkg_config: "1"
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kazuk/ci-builder@sha256:911d5ec28d1a1981022eb07d510c90c73df720e214e2e164b83cec6aa7bb5636
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Prepare explicitly selected SQLite comparison
        run: |
          rustc -Vv
          cargo --version
          cargo nextest --version
          apt-get update
          apt-get install -y --no-install-recommends \
            libsqlite3-0=3.45.1-1ubuntu2.8 \
            libsqlite3-dev=3.45.1-1ubuntu2.8 \
            sqlite3=3.45.1-1ubuntu2.8
          pkg-config --modversion sqlite3
          sqlite3 :memory: 'SELECT sqlite_version(); PRAGMA compile_options;'

      - name: Install Rust problem matcher
        run: echo "::add-matcher::.github/problem-matchers/rust.json"

      - name: Disk usage before cache restore
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-workspace-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache/restore@v5
        id: compiler-cache
        with:
          path: /github/home/.cache/sccache
          key: sqlite-eval-698-sccache-${{ runner.os }}-${{ matrix.sqlite }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-workspace-all-features-${{ hashFiles('**/Cargo.lock') }}

      - name: Build and test with all features
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export LIBSQLITE3_SYS_USE_PKG_CONFIG="${{ matrix.use_pkg_config }}"
          export SCCACHE_DIR=/github/home/.cache/sccache
          cargo tree --workspace --all-features --locked -e features -i libsqlite3-sys
          .local/bin/check-test-flow --all-features --step=workspace --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --show-progress none
            --timings"
          sccache --show-stats

      - name: Save experiment compiler cache even after compatibility failure
        uses: actions/cache/save@v5
        if: ${{ always() && steps.compiler-cache.outputs.cache-hit != 'true' }}
        with:
          path: /github/home/.cache/sccache
          key: sqlite-eval-698-sccache-${{ runner.os }}-${{ matrix.sqlite }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Disk usage after build and test
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Record candidate workspace linkage and runtime
        if: ${{ always() }}
        run: |
          export SQL_FUN_HOME="${GITHUB_WORKSPACE}/sql-fun-home"
          for binary in target/debug/deps/writable_views-*; do
            if [ -f "$binary" ] && [ -x "$binary" ]; then
              ldd "$binary"
              "$binary" --nocapture sqlite_trigger_oracle
            fi
          done

      - name: Upload Cargo compilation timings
        uses: actions/upload-artifact@v7
        if: ${{ always() }}
        with:
          name: cargo-timings-${{ matrix.sqlite }}-${{ github.run_attempt }}
          path: target/cargo-timings/*.html
          retention-days: 30
          if-no-files-found: warn

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: nextest tests (all features)
          path: target/nextest/ci/junit.xml
          reporter: java-junit
