name: build and test

on:
  pull_request:
    branches-ignore:
      - ci-image
    types:
      - opened
      - synchronize
      - reopened
  merge_group:

env:
  CARGO_TERM_COLOR: never
  USER: runner

jobs:
  workspace:
    runs-on: ubuntu-24.04
    container: &ci-builder-container
      image: ghcr.io/kazuk/ci-builder@sha256:1e8a6a618d5f37c7eaf588650999b53dd39220323ea475a66a52987d1479ebf3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Disk usage before cache restore
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-workspace-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build and test
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=workspace --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --show-progress none"
          sccache --show-stats

      - name: Disk usage after build and test
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: nextest tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit


  workspace-all-features:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - name: Disk usage before cache restore
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-workspace-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-workspace-all-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build and test with all features
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --all-features --step=workspace --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --show-progress none"
          sccache --show-stats

      - name: Disk usage after build and test
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: nextest tests (all features)
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  proc-macro-tests:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-proc-macro-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-proc-macro-tests-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Proc-macro compilation tests
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=proc-macro-tests --all-features --nextest-extra="
            --config-file ./ci/nextest/config.toml
            --profile ci
            --test-threads=1
            --show-progress none"
          sccache --show-stats

      - name: Disk usage after proc-macro compilation tests
        if: ${{ always() }}
        run: |
          df -h . /usr/local/cargo /github/home
          df -i . /usr/local/cargo /github/home
          for path in target /usr/local/cargo/registry /usr/local/cargo/git /github/home/.cache/sccache; do
            if [ -d "$path" ]; then
              du -sh "$path"
            fi
          done

      - name: Test Report
        uses: dorny/test-reporter@v3
        if: ${{ !cancelled() }}
        with:
          name: proc-macro compilation tests
          path: target/nextest/ci/junit.xml
          reporter: java-junit

  fmt:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - name: Check formatting
        run: .local/bin/check-test-flow --step=fmt --fmt-check

  lint:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Lint
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=lint
          sccache --show-stats

      - name: Check typos
        run: .local/bin/check-test-flow --step=typos

      - name: Validate skills
        run: .local/bin/check-test-flow --step=skill-lint

      - name: Lint Markdown
        run: .local/bin/check-test-flow --step=markdown-lint

  server-api-spec:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Generate server API spec
        run: |
          GIT_ROOT="$(git rev-parse --show-toplevel)"
          export GIT_ROOT
          export SQL_FUN_HOME="${GIT_ROOT}/sql-fun-home"
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=server-api-spec
          sccache --show-stats

  deny:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - name: Check dependencies
        run: .local/bin/check-test-flow --step=deny

  dependency-updates:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check dependency updates
        run: .local/bin/check-test-flow --step=dependency-updates

  doc:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    steps:
      - uses: actions/checkout@v5

      - uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - uses: actions/cache@v5
        with:
          path: /github/home/.cache/sccache
          key: sccache-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            sccache-${{ runner.os }}-

      - name: Build docs
        run: |
          sccache --start-server
          export RUSTC_WRAPPER=sccache
          export SCCACHE_DIR=/github/home/.cache/sccache
          .local/bin/check-test-flow --step=doc
          sccache --show-stats

  packaging:
    runs-on: ubuntu-24.04
    container: *ci-builder-container
    env:
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v5

      - name: Build and validate Linux distributions
        run: .local/bin/check-test-flow --step=packaging

      - uses: actions/upload-artifact@v7
        with:
          name: sql-fun-x86_64-unknown-linux-gnu
          path: target/distributions/x86_64-unknown-linux-gnu/*
          if-no-files-found: error

  install-validation:
    runs-on: ubuntu-24.04
    needs: packaging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: sql-fun-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/sql-fun-artifact

      - name: Validate the installed CLI contract
        env:
          DOTSLASH_VERSION: v0.5.9
          DOTSLASH_SHA256: 4c75c6eb7890ae35993b962073f6d9bbe78b42b81a5691303ad70f63bfbf7196
          SCRUT_VERSION: v0.4.3
          SCRUT_DOTSLASH_SHA256: d2e4d5d36198f889dd7f827c29cc1b8cb2a362df98e47cdf84b5ee0e207151fc
        run: |
          validation_root="$RUNNER_TEMP/sql-fun-install-validation"
          mkdir -p "$validation_root/contracts"
          cp -R cli/contracts/. "$validation_root/contracts/"
          cp "$RUNNER_TEMP/sql-fun-artifact"/sql-fun_*.deb "$validation_root/"
          curl -fsSL -o "$validation_root/dotslash.tar.gz" \
            "https://github.com/facebook/dotslash/releases/download/${DOTSLASH_VERSION}/dotslash-linux-musl.x86_64.${DOTSLASH_VERSION}.tar.gz"
          printf '%s  %s\n' "$DOTSLASH_SHA256" "$validation_root/dotslash.tar.gz" | sha256sum --check --status
          tar -xzf "$validation_root/dotslash.tar.gz" -C "$validation_root"
          curl -fsSL -o "$validation_root/scrut.dotslash" \
            "https://github.com/facebookincubator/scrut/releases/download/${SCRUT_VERSION}/scrut"
          printf '%s  %s\n' "$SCRUT_DOTSLASH_SHA256" "$validation_root/scrut.dotslash" | sha256sum --check --status
          scrut_binary=$("$validation_root/dotslash" -- fetch "$validation_root/scrut.dotslash")
          install -m 0755 "$scrut_binary" "$validation_root/scrut"
          docker run --rm \
            --mount "type=bind,source=$validation_root,target=/validation,readonly" \
            ubuntu:24.04 bash -ceu '
              apt-get update
              apt-get install -y --no-install-recommends /validation/sql-fun_*.deb
              BASH_ENV=/validation/contracts/setup.sh \
                SQL_FUN_BIN=/usr/bin/sql-fun \
                /validation/scrut test /validation/contracts
            '

  postgres-extraction:
    runs-on: ubuntu-24.04
    needs: packaging
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: sql-fun-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/sql-fun-artifact

      - name: Install packaged extraction tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 "$RUNNER_TEMP/sql-fun-artifact"/sql-fun_*.deb

      - name: Validate installed PostgreSQL extraction and import
        run: |
          .local/bin/test-postgres-extraction \
            --binary /usr/bin/sql-fun \
            --output "$RUNNER_TEMP/sql-fun-postgres"
          for version in 17 18; do
            diff -r "sql-fun-home/postgres/$version" "$RUNNER_TEMP/sql-fun-postgres/$version"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: sql-fun-postgres-extracted
          path: |
            ${{ runner.temp }}/sql-fun-postgres/17/**
            ${{ runner.temp }}/sql-fun-postgres/18/**
          if-no-files-found: error

  build:
    runs-on: ubuntu-24.04
    needs:
      - workspace
      - workspace-all-features
      - proc-macro-tests
      - fmt
      - lint
      - server-api-spec
      - deny
      - dependency-updates
      - doc
      - packaging
      - install-validation
      - postgres-extraction
    steps:
      - name: Complete
        run: true
