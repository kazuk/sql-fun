
[package]
name = "sql-fun"
license = "MIT"
version = "0.1.0"
edition = "2024"
authors = ["kazuk"]

[package.metadata.database]
connector = "tokio-postgres"

[workspace]
resolver = "2"
members = [
    "cli",
    "examples/adventure-works",
    "parse_dat",
    "sql-fun-client",
    "sql-fun-core",
    "sql-fun-server",
    "sql-fun-sqlast",
    "xbuild",
]
[workspace.lints]

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
cargo_common_metadata = "allow"
multiple_crate_versions = "allow"

[workspace.dependencies]
anyhow = { version = "1.0", features = ["backtrace"] }
askama = "0.15"
backtrace-on-stack-overflow = "0.3"
bollard = "0.19"
chumsky = "0.12"
clap = { version = "4.5", features = ["derive", "env"] }
combine = "4.6"
compact_str = "0.9"
convert_case = "0.10"
ctor = "0.6"
derive-getters = "0.5"
derive_builder = "0.20"
directories = "6.0"
either = { version = "1.15", features = ["serde"] }
env_logger = "0.10"
fs2 = "0.4"
futures-util = "0.3"
glob = "0.3"
inquire = "0.9"
itertools = "0.14"
j9 = "0.1"
log = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }
nix = { version = "0.30", features = ["process", "signal"] }
owo-colors = "4.2.3"
pg_query = "6.1"
proc-macro2 = "1.0"
quote = "1.0"
rand = "0.9"
rstest = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shellexpand = "3.1"
smallvec = "1.15"
sql-fun-core = { path = "./sql-fun-core" }
sql-fun-sqlast = { path = "./sql-fun-sqlast" }
syn = "2.0"
sysinfo = "0.37"
testresult = "0.4"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tokio-postgres = "0.7"
toml = "0.9.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = { version = "2.5", features = ["serde"] }
walkdir = "2.3"
which = "4.4"

[lib]
proc-macro = true

[dependencies]
compact_str = { workspace = true }
derive_builder = { workspace = true }
pg_query = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
sha2 = { workspace = true }
smallvec = { workspace = true }
syn = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
derive_builder = { workspace = true }
rstest = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
