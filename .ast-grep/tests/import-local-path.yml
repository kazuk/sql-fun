id: import-local-path
valid:
  - 'use crate::names::FullName;'
  - 'pub use crate::names::{FullName, TableName as Table};'
  - 'use self::items::Thing as LocalThing;'
  - 'fn f(x: LocalThing) -> Option<LocalThing> { Some(x) }'
  - 'impl crate::traits::Display for FullName {}'
  - 'impl crate::traits::Convert<FullName> for TableName {}'
  - 'impl<T> crate::traits::Convert<Vec<T>> for TableName {}'
  - 'impl super::Hoge {}'
  - 'impl<T> super::Hoge<T> {}'
  - 'pub(in super::super) fn visible() {}'
  - '#[crate::attribute(crate::argument)] struct Item;'
  - 'crate::macro_name!(crate::TokenType);'
  - 'macro_rules! generate { () => { crate::names::FullName }; }'
  - 'fn f() { let s = "crate::names::FullName"; /* crate::names::FullName */ }'
  - 'fn f() -> std::io::Result<()> { external::run(); Ok(()) }'
  - 'fn f(x: &Self::Item) { Type::associated(); }'
invalid:
  - 'struct Field { value: crate::names::FullName }'
  - 'type Nested = Option<Vec<crate::names::FullName>>;'
  - 'fn f(x: crate::names::FullName) -> crate::names::TableName { todo!() }'
  - 'fn f() { let x: crate::names::FullName; }'
  - 'trait Child: crate::traits::Parent {}'
  - 'fn f<T: crate::traits::Bound>() {}'
  - 'fn f<T>() where T: crate::traits::Bound {}'
  - 'trait Child { type Item: crate::traits::Bound; }'
  - 'impl Child for Type { type Item = crate::names::FullName; }'
  - 'impl crate::traits::Convert<crate::names::FullName> for crate::names::TableName {}'
  - 'impl crate::names::FullName {}'
  - 'fn f() { crate::names::FullName::new(); }'
  - 'fn f() { let x = crate::names::FullName { value: 1 }; }'
  - 'fn f(x: Kind) { match x { crate::kind::Kind::Named => (), _ => () } }'
  - 'fn f() { let x = crate::constants::LIMIT; crate::factory::make(x); }'
  - 'fn f() { <crate::names::FullName as crate::traits::Convert>::convert(); }'
  - 'fn f() { self::items::Thing::new(); super::factory::make(); }'
  - 'type Item = crate /* module boundary */ :: names :: FullName;'
  - 'impl super::traits::Convert for super::Hoge {}'
  - 'impl super::Hoge<crate::names::FullName> {}'
  - 'impl crate::traits::Convert<crate::names::FullName> for TableName {}'
  - 'impl crate::traits::Convert<FullName> for crate::names::TableName {}'
  - 'fn f() { let limit = crate::constants::LIMIT; }'
  - 'fn f() { crate::factory::make(); }'
