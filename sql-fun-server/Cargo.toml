[package]
name = "sql-fun-server"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "schema data service for sql-fun"
categories = ["database", "development-tools", "command-line-utilities"]
keywords.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sql-fun-server"
path = "src/main.rs"
doc = false

[features]
sqlite = ["sql-fun-core/sqlite", "sql-fun-sqlast/sqlite", "sql-fun-server-api/sqlite"]

[dependencies]
clap = { workspace = true }
derive-getters = { workspace = true }
either.workspace = true
elsa.workspace = true
futures-core.workspace = true
futures-util.workspace = true
indexmap = { workspace = true }
miette.workspace = true
notify = "8.2.0"
rand = { workspace = true }
scopeguard = "1.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
sql-fun-core.workspace = true
sql-fun-server-api.workspace = true
sql-fun-sqlast.workspace = true
sysinfo = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
tempfile.workspace = true
testresult.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
