name: github actions custom image builder

on:
  pull_request:
    branches: ["ci-image"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE_CONTEXT: "./ci/github-actions/"
      DOCKER_FILE: "./ci/github-actions/Dockerfile"
      LOCAL_IMAGE_TAG: "ci-builder:local"
    steps:
      - name: Require single commit
        env:
          PR_COMMITS: ${{ github.event.pull_request.commits }}
        run: |
          if [ "$PR_COMMITS" -ne 1 ]; then
            echo "ci-image pull requests must contain exactly one commit"
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Resolve tool releases
        id: tools
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          printf '## CI image tool versions\n\n| Tool | Release |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          set -euo pipefail
          for tool in CARGO_BINSTALL TYPOS; do
            case "$tool" in
              CARGO_BINSTALL) repository=cargo-bins/cargo-binstall ;;
              TYPOS) repository=crate-ci/typos ;;
            esac
            release=$(curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${repository}/releases/latest")
            tag=$(jq -er '
              select(.draft == false and .prerelease == false)
              | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
            ' <<<"$release") || { echo "Invalid release tag or asset digest for $repository" >&2; exit 1; }
            case "$tool" in
              CARGO_BINSTALL) asset=cargo-binstall-x86_64-unknown-linux-musl.tgz ;;
              TYPOS) asset="typos-${tag}-x86_64-unknown-linux-musl.tar.gz" ;;
            esac
            checksum=$(jq -er --arg asset "$asset" '
              [.assets[] | select(.name == $asset)]
              | select(length == 1) | .[0].digest
              | select(type == "string" and test("^sha256:[0-9a-f]{64}$"))
              | ltrimstr("sha256:")
            ' <<<"$release") || { echo "Invalid release tag or asset digest for $repository" >&2; exit 1; }
            printf '%s=%s\n' "${tool}_TAG" "$tag" >> "$GITHUB_OUTPUT"
            printf '%s=%s\n' "${tool}_SHA256" "$checksum" >> "$GITHUB_OUTPUT"
            printf '| %s | %s |\n' "$repository" "$tag" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Set up Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Build (load only)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ${{ env.IMAGE_CONTEXT }}
          file: ${{ env.DOCKER_FILE }}
          load: true
          tags: ${{ env.LOCAL_IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            SERENA_TAG=v0.1.4
            CARGO_BINSTALL_TAG=${{ steps.tools.outputs.CARGO_BINSTALL_TAG }}
            CARGO_BINSTALL_SHA256=${{ steps.tools.outputs.CARGO_BINSTALL_SHA256 }}
            TYPOS_TAG=${{ steps.tools.outputs.TYPOS_TAG }}
            TYPOS_SHA256=${{ steps.tools.outputs.TYPOS_SHA256 }}

      - name: Smoke test
        env:
          CARGO_BINSTALL_TAG: ${{ steps.tools.outputs.CARGO_BINSTALL_TAG }}
          TYPOS_TAG: ${{ steps.tools.outputs.TYPOS_TAG }}
        run: |
          test "$(docker run --rm "${LOCAL_IMAGE_TAG}" cargo binstall -V)" = "${CARGO_BINSTALL_TAG#v}"
          test "$(docker run --rm "${LOCAL_IMAGE_TAG}" typos --version)" = "typos-cli ${TYPOS_TAG#v}"
          test "$(docker run --rm "${LOCAL_IMAGE_TAG}" scrut --version)" = "scrut 0.4.3"
          docker run --rm "${LOCAL_IMAGE_TAG}" cargo --version
          docker run --rm "${LOCAL_IMAGE_TAG}" cargo deny --version
          docker run --rm "${LOCAL_IMAGE_TAG}" mdbook --help >/dev/null
