[package]
name = "sql-fun-codegen"
license = "MIT"
version = "0.1.1-snapshot1"
edition = "2024"
categories = ["database", "development-tools"]
keywords.workspace = true
repository.workspace = true
description = "proc-macro helper objects for sql-fun"
readme = "README.md"
rust-version.workspace = true

[features]
sqlite = ["sql-fun-core/sqlite"]
nightly-unstable = ["proc_macro_diagnostic"]
proc_macro_diagnostic = []

[dependencies]
assert_matches.workspace = true
bon = "3.10.1"
proc-macro2.workspace = true
proc_macro2_diagnostic = "0.8.0"
quote.workspace = true
serde_json.workspace = true
serde_json_path.workspace = true
serde_saphyr.workspace = true
sha256.workspace = true
sql-fun-core.workspace = true
syn.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true

[dev-dependencies]
derive_builder.workspace = true
rstest.workspace = true
rusqlite = { workspace = true, features = ["hooks"] }
tempfile.workspace = true
testresult.workspace = true
tokio.workspace = true
tokio-postgres.workspace = true

[lints]
workspace = true
