[package]
name = "sql-fun-sqlast"
license = "MIT"
version = "0.1.0"
edition = "2024"
description = "semantic analyzer for PostgreSQL and SQLite"
categories = ["database", "development-tools"]
keywords.workspace = true
repository.workspace = true
readme = "README.md"
rust-version.workspace = true

[features]
default = []
syn_serde = []
sqlite = ["turso_parser", "sql-fun-core/sqlite"]
turso_parser = ["dep:turso_parser"]

[dependencies]
combine = { workspace = true }
derive-getters = { workspace = true }
derive_builder = { workspace = true }
itertools = { workspace = true }
miette = { workspace = true }
owo-colors = { workspace = true }
pg_query = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sql-fun-core = { workspace = true }
stacker = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
turso_parser = { version = "0.8.1", optional = true }

[dev-dependencies]
assert_matches.workspace = true
backtrace-on-stack-overflow.workspace = true
clap = { workspace = true }
ctor = { workspace = true }
rstest = { workspace = true }
tempfile = { workspace = true }
testresult = { workspace = true }
tracing-subscriber = { workspace = true }
trybuild = { workspace = true }

[lints]
workspace = true
