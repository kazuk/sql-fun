name: Release preparation

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: release-preparation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    permissions:
      contents: write
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kazuk/ci-builder@sha256:5a9fb8282de0a11c8291cdc368461e8ed432a528adddc2777e8d9dd744386e8f
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      classification: ${{ steps.identity.outputs.classification }}
      revision: ${{ steps.identity.outputs.revision }}
      source: ${{ steps.state.outputs.source }}
      materialized-revision: ${{ steps.final.outputs.revision }}
      release-ref: ${{ github.ref }}
      ci-run-id: ${{ steps.ci.outputs.run_id }}
      ci-run-url: ${{ steps.ci.outputs.run_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Parse release branch identity
        id: identity
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: .local/sbin/release-branch-identity "$RELEASE_REF" "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve recorded release state
        id: state
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --no-project --no-config --python 3.12 \
            .local/sbin/release-state resolve "$RELEASE_REF" "$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Resolve immutable remote tag
        id: tag
        env:
          RELEASE_REF: ${{ github.ref }}
          RECORDED_REVISION: ${{ steps.state.outputs.revision }}
        run: |
          uv run --no-project --no-config --python 3.12 \
            .local/sbin/release-state tag-status "$RELEASE_REF" "$RECORDED_REVISION" >> "$GITHUB_OUTPUT"

      - name: Require successful exact-SHA normal CI
        if: steps.tag.outputs.status == 'absent'
        id: ci
        env:
          SOURCE_SHA: ${{ steps.state.outputs.source }}
        run: |
          selected="$(.local/sbin/resolve-release-ci-run "$GITHUB_REPOSITORY" "$SOURCE_SHA")"
          {
            echo "run_id=$(jq -r '.id' <<<"$selected")"
            echo "run_url=$(jq -r '.html_url' <<<"$selected")"
          } >> "$GITHUB_OUTPUT"
      - name: Adopt required CI release inputs
        if: steps.tag.outputs.status == 'absent'
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run_id }}
        run: |
          .local/sbin/adopt-release-ci-inputs "$GITHUB_REPOSITORY" "$CI_RUN_ID" \
            "$RUNNER_TEMP/release-inputs" \
            sql-fun-user-manual sql-fun-semver-baseline
      - name: Materialize crate versions
        id: materialize
        if: steps.tag.outputs.status == 'absent' && steps.state.outputs.status == 'new'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
          RELEASE_PRERELEASE: ${{ steps.identity.outputs.prerelease }}
        run: |
          state="$RUNNER_TEMP/release-state"
          .local/sbin/materialize-release-state "$RELEASE_CLASSIFICATION" "$RELEASE_PRERELEASE" "$state" "$RELEASE_TAG"
          {
            echo "versions=$state/crates.tsv"
            echo "paths=$state/changed-paths.txt"
          } >> "$GITHUB_OUTPUT"
      - name: Package adopted manual
        if: steps.tag.outputs.status == 'absent'
        id: manual
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
        run: |
          manual="$RUNNER_TEMP/release-inputs/sql-fun-user-manual"
          [[ -d "$manual" ]] || {
            echo "Required adopted manual input missing: $manual" >&2
            exit 1
          }
          archive="sql-fun_${RELEASE_TAG}_user-manual.tar.gz"
          directory="$RUNNER_TEMP/release-assets"
          mkdir -p "$directory"
          tar -czf "$directory/$archive" -C "$manual" .
          # Later release assembly consumes this archive without repackaging.
          {
            echo "archive=$archive"
            echo "path=$directory/$archive"
          } >> "$GITHUB_OUTPUT"
      - name: Retain versioned manual asset
        if: steps.tag.outputs.status == 'absent'
        uses: actions/upload-artifact@v7
        with:
          name: release-manual-${{ github.run_attempt }}
          path: ${{ steps.manual.outputs.path }}
          if-no-files-found: error
      - name: Adopt SemVer baseline candidate
        id: baseline
        if: steps.tag.outputs.status == 'absent' && steps.state.outputs.status == 'new'
        env:
          RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
        run: |
          result="$(uv run --no-project --no-config --python 3.12 \
            .local/sbin/adopt-semver-baseline \
            --candidate "$RUNNER_TEMP/release-inputs/sql-fun-semver-baseline/semver_baseline.tar.gz" \
            --active "$GITHUB_WORKSPACE/.local/semver_baseline.tar.gz" \
            --release-kind "$RELEASE_CLASSIFICATION")" || {
            echo "$result" >&2
            exit 1
          }
          echo "$result"
          paths="$RUNNER_TEMP/release-state/baseline-paths.txt"
          : > "$paths"
          if [[ "$RELEASE_CLASSIFICATION" == stable ]]; then
            echo '.local/semver_baseline.tar.gz' > "$paths"
          fi
          {
            echo "status=$(jq -r '.status' <<<"$result")"
            echo "paths=$paths"
          } >> "$GITHUB_OUTPUT"
      - name: Commit release state on the release branch
        id: committed
        if: steps.tag.outputs.status == 'absent' && steps.state.outputs.status == 'new'
        env:
          RELEASE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ steps.state.outputs.source }}
          MATERIALIZED_PATHS: ${{ steps.materialize.outputs.paths }}
          BASELINE_PATHS: ${{ steps.baseline.outputs.paths }}
        run: |
          uv run --no-project --no-config --python 3.12 \
            .local/sbin/release-state commit "$RELEASE_REF" "$SOURCE_SHA" \
            "$MATERIALIZED_PATHS" "$BASELINE_PATHS" >> "$GITHUB_OUTPUT"

      - name: Hand off committed release source
        id: final
        env:
          CREATED_REVISION: ${{ steps.committed.outputs.revision }}
          RECORDED_REVISION: ${{ steps.state.outputs.revision }}
          RELEASE_STATUS: ${{ steps.state.outputs.status }}
          SOURCE_SHA: ${{ steps.state.outputs.source }}
          CI_RUN_URL: ${{ steps.ci.outputs.run_url }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
          MANUAL_ARCHIVE: ${{ steps.manual.outputs.archive }}
        run: |
          revision="${CREATED_REVISION:-$RECORDED_REVISION}"
          [[ "$(git rev-parse HEAD)" == "$revision" ]]
          versions="$RUNNER_TEMP/committed-crates.tsv"
          .local/bin/release-crate-manifest > "$versions"
          {
            echo "revision=$revision"
            echo "versions=$versions"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Product release: $RELEASE_TAG ($RELEASE_CLASSIFICATION)"
            echo "Original source: $SOURCE_SHA"
            echo "Recorded release source: $revision ($RELEASE_STATUS attempt)"
            echo "Release branch: $GITHUB_REF"
            echo "Tag preflight: ${{ steps.tag.outputs.status }}"
            if [[ -n "$CI_RUN_URL" ]]; then
              echo "Normal CI: $CI_RUN_URL"
              echo 'Adopted: sql-fun-user-manual, sql-fun-semver-baseline'
              echo "Manual asset: $MANUAL_ARCHIVE (Actions artifact: release-manual-$GITHUB_RUN_ATTEMPT)"
            else
              echo 'Matching-tag recovery: CI inputs and all producer work skipped.'
            fi
            echo 'main was not modified. Prepared assets will be attached to a draft.'
            echo 'Materialized crate versions:'
            echo '```text'
            cat "$versions"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build and assemble committed release assets
        id: build
        if: steps.tag.outputs.status == 'absent'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RECORDED_REVISION: ${{ steps.final.outputs.revision }}
          MANUAL_PATH: ${{ steps.manual.outputs.path }}
        run: |
          uv run --no-project --no-config --python 3.12 .local/sbin/release-assets build \
            --tag "$RELEASE_TAG" --revision "$RECORDED_REVISION" \
            --target "$RUNNER_TEMP/release-target-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            --directory "$RUNNER_TEMP/prepared-release-assets" --manual "$MANUAL_PATH" >> "$GITHUB_OUTPUT"

      - name: Retain complete prepared release assets before tagging
        id: retained
        if: steps.tag.outputs.status == 'absent'
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ steps.identity.outputs.tag }}-${{ steps.final.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.build.outputs.directory }}/*
          if-no-files-found: error

      - name: Record retained asset locator before tag push
        if: steps.tag.outputs.status == 'absent'
        env:
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.retained.outputs.artifact-url }}
        run: |
          echo "Complete prepared assets retained: artifact $ARTIFACT_ID, $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Create and push immutable release tag
        if: steps.tag.outputs.status == 'absent'
        env:
          RELEASE_REF: ${{ github.ref }}
          RECORDED_REVISION: ${{ steps.final.outputs.revision }}
        run: |
          uv run --no-project --no-config --python 3.12 \
            .local/sbin/release-state tag-push "$RELEASE_REF" "$RECORDED_REVISION"

      - name: Restore available prepared assets for existing tag
        id: restored
        if: steps.tag.outputs.status == 'matching'
        env:
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RECORDED_REVISION: ${{ steps.final.outputs.revision }}
          SOURCE_SHA: ${{ steps.state.outputs.source }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          uv run --no-project --no-config --python 3.12 .local/sbin/release-assets restore \
            --tag "$RELEASE_TAG" --revision "$RECORDED_REVISION" --source "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" --ref "$RELEASE_REF" \
            --directory "$RUNNER_TEMP/prepared-release-assets" >> "$GITHUB_OUTPUT"

      - name: Hand off prepared assets for draft preparation
        id: assets
        env:
          ASSET_DIRECTORY: ${{ steps.build.outputs.directory || steps.restored.outputs.directory }}
          ASSET_INVENTORY: ${{ steps.build.outputs.inventory || steps.restored.outputs.inventory }}
          ARTIFACT_ID: ${{ steps.retained.outputs.artifact-id || steps.restored.outputs.artifact-id }}
          ARTIFACT_NAME: release-assets-${{ steps.identity.outputs.tag }}-${{ steps.final.outputs.revision }}-${{ github.run_id }}-${{ github.run_attempt }}
          RESTORED_NAME: ${{ steps.restored.outputs.artifact-name }}
          PRODUCER_RUN: ${{ steps.restored.outputs.run-id || github.run_id }}
          TAG_STATUS: ${{ steps.tag.outputs.status }}
          RELEASE_TAG: ${{ steps.identity.outputs.tag }}
          RECORDED_REVISION: ${{ steps.final.outputs.revision }}
          SOURCE_SHA: ${{ steps.state.outputs.source }}
        run: |
          mode=produced
          [[ "$TAG_STATUS" != matching ]] || mode=recovered
          name="${RESTORED_NAME:-$ARTIFACT_NAME}"
          {
            echo "directory=$ASSET_DIRECTORY"
            echo "inventory=$ASSET_INVENTORY"
            echo "artifact-id=$ARTIFACT_ID"
            echo "artifact-name=$name"
            echo "run-id=$PRODUCER_RUN"
            echo "status=$mode"
            echo "tag=$RELEASE_TAG"
            echo "source=$SOURCE_SHA"
            echo "revision=$RECORDED_REVISION"
          } >> "$GITHUB_OUTPUT"
          {
            echo "Immutable remote tag: $RELEASE_TAG at $RECORDED_REVISION ($mode)"
            echo "Prepared assets: $ASSET_INVENTORY"
            echo "Actions artifact: $name (ID $ARTIFACT_ID, run $PRODUCER_RUN)"
            echo 'Complete assets are available for draft preparation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare or repair draft GitHub Release
        id: draft
        env:
          RELEASE_TAG: ${{ steps.assets.outputs.tag }}
          RELEASE_CLASSIFICATION: ${{ steps.identity.outputs.classification }}
          SOURCE_SHA: ${{ steps.assets.outputs.source }}
          RECORDED_REVISION: ${{ steps.assets.outputs.revision }}
          ASSET_DIRECTORY: ${{ steps.assets.outputs.directory }}
          ASSET_INVENTORY: ${{ steps.assets.outputs.inventory }}
        run: |
          uv run --no-project --no-config --python 3.12 .local/sbin/prepare-release-draft \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --classification "$RELEASE_CLASSIFICATION" --source "$SOURCE_SHA" \
            --revision "$RECORDED_REVISION" --directory "$ASSET_DIRECTORY" \
            --inventory "$ASSET_INVENTORY" >> "$GITHUB_OUTPUT"
